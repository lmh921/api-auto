# 单接口测试用例模板
name: "示例接口测试"
description: "这是一个单接口测试用例模板"
tags: ["示例", "GET"]

# 测试环境配置（可选，会覆盖全局配置）
env:
  base_url: "https://www.ziulife.com/client-api-dev/client"
  timeout: 10

# 请求配置
request:
  method: "GET"
  url: "/users/{id}"
  params:  # URL参数
    id: 1
  headers:  # 请求头
    Content-Type: "application/json"
    Authorization: "Bearer token123"
  # body:  # 请求体（POST/PUT等方法使用）
  #   username: "test"
  #   password: "123456"

# 断言配置
assertions:
  - type: "status_code"
    expected: 200
    message: "检查响应状态码"
  - type: "equal"
    jsonpath: "data.id"
    expected: 1
    message: "检查用户ID"
  - type: "contains"
    jsonpath: "data.name"
    expected: "Test"
    message: "检查用户名包含Test"

# 变量提取（用于后续接口调用）
extract:
  token: "data.token"
  user_id: "data.id"