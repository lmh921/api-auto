# ============================================================
# 全局配置文件
# 环境切换：pytest --env <环境名>（或设置环境变量 TEST_ENV），无需再手动注释/解注释
# ============================================================

# 默认执行环境（未指定 --env 时使用）
default_env: "client-dev"

# 环境列表
#   base_url      接口地址
#   caseData_path 用例目录
#   prod: true    标记为正式环境，执行必须显式追加 --confirm-prod（或环境变量 ALLOW_PROD=1）
environments:
  client-dev:
    base_url: "https://www.ziulife.com/client-api-dev/client"
    caseData_path: "data/client_data"
    # 数据库连接（驱动: mysql / sqlite；密码支持 $ENV{DB_PASSWORD} 外部化）
    # 当前为 sqlite 演示配置（离线可跑），接入真实数据库时换成 mysql 段（见README 6.9节）:
    # db:
    #   driver: mysql
    #   host: "127.0.0.1"
    #   port: 3306
    #   user: "test_rw"
    #   password: "$ENV{DB_PASSWORD}"
    #   database: "client_dev"
    #   charset: "utf8mb4"
    db:
      driver: sqlite
      path: "data/db_demo.sqlite"
  client-prod:
    base_url: "https://www.ziulife.com/client-api-prod/client"
    caseData_path: "data/client_data"
    prod: true
  station-dev:
    base_url: "https://www.ziulife.com/station-api-dev"
    caseData_path: "data/station_data"
  station-prod:
    base_url: "https://www.ziulife.com/station-api-prod"
    caseData_path: "data/station_data"
    prod: true

# 请求超时时间（秒）
timeout: 30

# 请求失败重试次数（5xx仅对幂等方法GET/HEAD/OPTIONS重试；连接类错误对所有方法重试）
retry_times: 3

# 重试间隔（秒）
retry_delay: 2.0

# 预置变量：所有用例可通过 ${变量名} 引用；值支持 $ENV{环境变量名} 引用环境变量（敏感数据外部化）
# 示例：
# variables:
#   test_mobile: "$ENV{TEST_MOBILE}"
variables: {}

# 变量作用域（详见 utils/variable_scope.py 与 README 变量章节）
#   mode:
#     strict  提取变量按用例作用域隔离：extract 产物仅本用例可见，
#             沿 depends_on 链向下游传播（传递闭包）；文件 setup 提取仅本文件可见；
#             未声明依赖却引用上游变量时 ${var} 保持字面量，立即暴露漏声明
#     shared  兼容旧行为：所有提取变量写入 session 级全局共享
#   overwrite: 提取变量遮蔽更低层同名变量时的策略
#     warn    告警日志（默认，不中断）
#     fail    直接用例失败
#     silent  忽略
variable_scope:
  mode: strict
  overwrite: warn

# 日志配置
log:
  level: "INFO"
  file_path: "logs/api_test.log"

# Allure报告配置
allure:
  report_dir: "reports/allure-results"
  clean: true
