# 数据库校验演示用例（sqlite内置驱动，离线可跑，验证框架的 db_* 能力）
# 演示内容：接口提取变量 -> 下一条用例db_setup落库 -> db_assertions校验 -> extract_from_db回读 -> db_teardown清理
#          用例4：完整业务闭环——前置造数 -> 接口调用 -> 后置落库校验 -> 清理
# 注意时序：db_setup 在请求之前执行，若需引用上游接口的变量，请拆成跨用例传参（如本文件用例1->用例2）
#          extract_from_db 在接口断言之后执行，回读变量仅供后续用例使用，不能在本用例断言中引用
# 接入真实项目时可将本文件作为模板，驱动换成 mysql（见 config.yaml 的 db 段注释与README 6.9节）
description: "数据库连接与校验能力演示：API数据落库校验 + 纯数据库校验用例"
tags: ["数据库", "演示"]

testcases:
  # 用例1：调接口提取变量（供用例2的db_setup使用；strict作用域下经depends_on链传递）
  - name: "接口提取用户名"
    description: "调公共API提取用户名，模拟业务接口返回数据"
    tags: ["GET", "API+DB"]
    env:
      base_url: "https://jsonplaceholder.typicode.com"   # 用例级env覆盖（离线演示接口）
    request:
      method: "GET"
      url: "/users/1"
    assertions:
      - type: "status_code"
        expected: 200
        message: "接口状态码"
    extract:
      api_user_name: "name"

  # 用例2：接口数据落库校验（模拟"接口创建的数据应正确落库"）
  - name: "接口数据落库校验"
    description: "把接口提取的用户名写入sqlite，校验落库结果一致，最后清理"
    depends_on:                       # 显式依赖：${api_user_name} 沿依赖链从上游传递（传递闭包）
      - "接口提取用户名"               # 不声明则变量不可见，${var} 保持字面量立即暴露漏声明
    tags: ["DB"]
    db_setup:   # 前置：建表 + 写入接口数据（真实项目中通常是接口自己落库，这里演示能力）
      - "CREATE TABLE IF NOT EXISTS demo_users (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT, tag TEXT)"
      - "INSERT INTO demo_users(name, tag) VALUES ('${api_user_name}', 'auto_demo')"

    db_assertions:
      - type: "row_count"
        sql: "SELECT id FROM demo_users WHERE tag = 'auto_demo'"
        op: ">="
        expected: 1
        message: "接口数据应落库"
      - type: "value"
        sql: "SELECT name FROM demo_users WHERE tag = 'auto_demo'"
        expected: "${api_user_name}"     # 整串占位符保留原始类型
        message: "落库name与接口返回一致"
      - type: "contains_row"
        sql: "SELECT name FROM demo_users WHERE tag = 'auto_demo'"
        column: "name"
        expected: "${api_user_name}"
        message: "查询结果包含接口用户名"

    extract_from_db:
      demo_user_id: "SELECT id FROM demo_users WHERE tag = 'auto_demo'"

    db_teardown:   # 清理：无论断言成败都执行，数据不残留
      - "DELETE FROM demo_users WHERE tag = 'auto_demo'"
      - "DROP TABLE demo_users"

  # 用例3：纯数据库校验用例（无request，校验数据口径/存储过程结果等场景）
  - name: "纯数据库校验用例"
    description: "不发起任何接口请求，仅做库内数据准备、校验与清理"
    tags: ["DB"]
    db_setup:
      - "CREATE TABLE IF NOT EXISTS demo_counter (n INTEGER)"
      - "INSERT INTO demo_counter(n) VALUES (1)"
      - "INSERT INTO demo_counter(n) VALUES (2)"
    db_assertions:
      - type: "row_count"
        sql: "SELECT n FROM demo_counter"
        op: "=="
        expected: 2
        message: "计数表应有2行"
      - type: "value"
        sql: "SELECT MAX(n) AS max_n FROM demo_counter"
        column: "max_n"
        op: "=="
        expected: 2
        message: "最大值应为2"
    extract_from_db:
      max_n: "SELECT MAX(n) AS max_n FROM demo_counter"
    db_teardown:
      - "DROP TABLE demo_counter"

  # 用例4：完整业务闭环演示——前置DB造数 -> 接口调用 -> 后置落库校验 -> 清理
  # 真实项目套路：db_setup预置业务数据 -> 携带造数调用业务接口 -> db_assertions校验接口写库结果
  #              -> db_teardown清理（无论断言成败都执行，数据不残留）
  # 离线演示说明：jsonplaceholder不会写本地sqlite，故db_assertions校验的是造数基线数据；
  #              接入真实项目后，把db_assertions的SQL换成校验接口落库字段即可（如余额变动、状态流转）
  - name: "前置造数+接口调用+落库校验+清理"
    description: "预置账户数据后调用开户接口，校验接口回显与库内数据一致，最后清理造数"
    tags: ["DB", "API+DB"]

    db_setup:   # 前置造数：预置一条账户记录（造数值用字面量保证可读；需随机唯一数据可改用 ${rand_mobile()}/${uuid()} 等内置函数，见 README 6.12）
      - "CREATE TABLE IF NOT EXISTS demo_accounts (id INTEGER PRIMARY KEY, name TEXT, balance NUMERIC, status TEXT)"
      - "INSERT INTO demo_accounts (id, name, balance, status) VALUES (1001, '自动化账户', 666.66, 'ACTIVE')"

    env:
      base_url: "https://jsonplaceholder.typicode.com"   # 用例级env覆盖（离线演示接口）
    request:    # 接口调用：携带造数数据发起业务请求（模拟"账户开户"，接口会回显请求体）
      method: "POST"
      url: "/posts"
      headers:
        Content-Type: "application/json"
      json:
        accountId: 1001                    # 与db_setup造数的id一致
        accountName: "自动化账户"
        balance: 666.66
    assertions:
      - type: "status_code"
        expected: 201
        message: "开户接口状态码"
      - type: "equal"
        jsonpath: "accountId"
        expected: 1001
        message: "接口回显accountId与造数一致"

    db_assertions:   # 后置落库校验：真实项目中此处应校验接口写库的结果
      - type: "row_count"
        sql: "SELECT id FROM demo_accounts WHERE id = 1001"
        op: "=="
        expected: 1
        message: "造数记录应恰好1条"
      - type: "value"
        sql: "SELECT balance FROM demo_accounts WHERE id = 1001"
        expected: 666.66
        message: "库内余额与造数/接口请求一致"
      - type: "value"
        sql: "SELECT status FROM demo_accounts WHERE id = 1001"
        expected: "ACTIVE"
        message: "库内账户状态正确"

    extract_from_db:   # 回读库内数据为变量（时序在断言之后，仅供后续用例引用）
      db_account_name: "SELECT name FROM demo_accounts WHERE id = 1001"

    db_teardown:   # 清理：无论断言成败都执行，造数与过程表不残留
      - "DELETE FROM demo_accounts WHERE id = 1001"
      - "DROP TABLE demo_accounts"
