[pytest]
# 测试用例发现路径
testpaths = testcases
# 测试用例文件匹配规则
python_files = test_*.py
# 测试类匹配规则
python_classes = Test*
# 测试方法匹配规则
python_functions = test_*
# 添加参数标记
markers = 
    smoke: 冒烟测试用例
    regression: 回归测试用例
    api: API测试用例
# Allure报告配置
addopts = -v -s --alluredir=reports/allure-results --clean-alluredir
# 禁用警告
filterwarnings = ignore::DeprecationWarning